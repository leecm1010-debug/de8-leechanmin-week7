# Q4: Spark Standalone 클러스터 (master 1대 + worker 2대)
# 실행: docker compose -f docker-compose.spark.yaml up -d
name: spark   # Airflow compose(project)와 컨테이너 묶음을 분리

x-spark-common: &spark-common
  image: apache/spark:3.5.7-python3
  volumes:
    - ./jobs:/opt/spark/jobs       # 잡 스크립트 (wordcount.py)
    - ./data:/opt/spark/data       # 입력 파일 (wordcount.txt)
    - ./output:/opt/spark/output   # spark-submit 실행 로그 저장용
  networks:
    - spark-net

services:
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"   # Master Web UI (Airflow 가 8080 을 쓰므로 8081 로 연결)
      - "7077:7077"   # 클러스터 접속 주소 spark://spark-master:7077

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_DIR: /tmp/spark-work
    depends_on:
      - spark-master

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_DIR: /tmp/spark-work
    depends_on:
      - spark-master

networks:
  spark-net:
